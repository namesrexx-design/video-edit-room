<title>LYFE Studio · Storyboard</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,500;6..72,600&family=Source+Sans+3:wght@400;600;700&display=swap">
<style>
  :root{ --bg:#f6f1e8; --panel:#efe4d2; --panel2:#e6d8c1; --text:#26221f; --muted:#5e554d; --accent:#a75f3c; --accent-ink:#fff; --ok:#5f7048; --line:#d3c4ac; --sel:#a75f3c; --v1:#c9b28f; --v2:#9fb08a; --a2:#d9a27a; --script:#e9dcc4; --ph:#a72e2e; }
  @media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){ --bg:#1e1a17; --panel:#2b2521; --panel2:#3a322c; --text:#f3ece1; --muted:#c2b5a3; --accent:#d48a63; --accent-ink:#1e1a17; --ok:#8ea06f; --line:#4a403a; --sel:#d48a63; --v1:#6b5a43; --v2:#5b6b48; --a2:#8a5d3f; --script:#3a322c; --ph:#ff6b6b; } }
  :root[data-theme="dark"]{ --bg:#1e1a17; --panel:#2b2521; --panel2:#3a322c; --text:#f3ece1; --muted:#c2b5a3; --accent:#d48a63; --accent-ink:#1e1a17; --ok:#8ea06f; --line:#4a403a; --sel:#d48a63; --v1:#6b5a43; --v2:#5b6b48; --a2:#8a5d3f; --script:#3a322c; --ph:#ff6b6b; }
  *{ box-sizing:border-box; }
  body{ margin:0; background:var(--bg); color:var(--text); font-family:"Source Sans 3","Segoe UI",system-ui,sans-serif; font-size:20px; line-height:1.4; -webkit-tap-highlight-color:transparent; }
  .wrap{ max-width:1200px; margin:0 auto; padding-inline:16px; padding-block:14px 90px; }
  header{ display:flex; align-items:center; justify-content:space-between; gap:12px; flex-wrap:wrap; margin-bottom:10px; }
  h1{ font-family:Newsreader,Georgia,serif; font-weight:600; font-size:clamp(28px,5vw,40px); margin:0; line-height:1.05; text-shadow:1px 1px 0 rgba(0,0,0,.12); }
  .sub{ color:var(--muted); font-size:18px; margin:2px 0 0; }
  .brand{ font-family:"Source Sans 3",sans-serif; font-weight:700; letter-spacing:.22em; font-size:15px; color:var(--accent); text-transform:uppercase; } .brand span{ color:var(--muted); }
  .tabs{ display:flex; gap:6px; margin:6px 0 14px; border-bottom:2px solid var(--line); }
  .tabs button{ background:transparent; border-radius:10px 10px 0 0; border-bottom:4px solid transparent; font-size:20px; padding:10px 18px; }
  .tabs button.on{ border-bottom-color:var(--accent); color:var(--accent); background:var(--panel); }
  .grid{ display:grid; grid-template-columns:repeat(auto-fill,minmax(210px,1fr)); gap:12px; }
  .bcard{ background:var(--panel); border-radius:12px; overflow:hidden; border:3px solid transparent; cursor:pointer; }
  .bcard img{ display:block; width:100%; aspect-ratio:16/9; object-fit:cover; background:#2b2521; }
  .bcard .ph{ width:100%; aspect-ratio:16/9; background:linear-gradient(135deg,var(--panel2),var(--panel)); display:flex; align-items:center; justify-content:center; color:var(--muted); font-size:15px; }
  .bcard .b{ padding:8px 10px 10px; } .bcard .id{ display:inline-block; background:var(--accent); color:var(--accent-ink); font-weight:700; font-size:14px; padding:1px 8px; border-radius:6px; margin-bottom:4px; }
  .bcard .ok{ background:var(--ok); } .bcard .no{ background:var(--muted); }
  .bcard h4{ margin:2px 0 4px; font-size:17px; line-height:1.2; } .bcard p{ margin:0; font-size:14.5px; color:var(--muted); line-height:1.3; display:-webkit-box; -webkit-line-clamp:3; -webkit-box-orient:vertical; overflow:hidden; }
  .chip{ display:inline-block; font-size:13.5px; padding:1px 8px; border-radius:6px; background:var(--panel2); margin-top:6px; } .chip.old{ background:#c9b28f; color:#26221f; font-weight:600; }
  .char{ background:var(--panel); border-radius:14px; padding:14px 16px; margin:12px 0 18px; }
  .char h3{ font-family:Newsreader,Georgia,serif; font-size:30px; margin:0 0 4px; } .char .facts{ font-size:16.5px; color:var(--muted); line-height:1.45; margin:0 0 10px; } .char .facts b{ color:var(--text); }
  .char .grid{ grid-template-columns:repeat(auto-fill,minmax(160px,1fr)); }
  .char .bcard img{ aspect-ratio:3/4; object-fit:cover; object-position:top; }
  button{ font:inherit; font-weight:600; border:0; border-radius:10px; padding:11px 16px; min-height:48px; cursor:pointer; color:var(--text); background:var(--panel2); }
  button:active{ transform:translateY(1px); } button:disabled{ opacity:.45; cursor:default; }
  button:focus-visible{ outline:3px solid var(--accent); outline-offset:2px; }
  button.primary{ background:var(--accent); color:var(--accent-ink); }
  button.icon{ padding:0; width:48px; min-width:48px; font-size:24px; }
  .player{ position:relative; background:#000; border-radius:10px; overflow:hidden; aspect-ratio:16/9; max-width:100%; box-shadow:0 12px 36px rgba(38,34,31,.28); }
  .player video{ position:absolute; inset:0; width:100%; height:100%; display:block; background:#000; }
  #v2{ display:none; } #v2.on{ display:block; }
  .bigplay{ position:absolute; inset:0; margin:auto; width:96px; height:96px; border-radius:50%; background:rgba(38,34,31,.72); color:#fff; font-size:44px; display:flex; align-items:center; justify-content:center; border:0; cursor:pointer; z-index:3; }
  .bigplay[hidden]{ display:none; }
  .now{ position:absolute; left:12px; bottom:10px; color:#fff; font-weight:600; font-size:18px; text-shadow:1px 1px 2px #000; background:rgba(0,0,0,.35); padding:2px 10px; border-radius:6px; z-index:3; max-width:90%; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .controls{ display:flex; gap:8px; align-items:center; margin:10px 0 6px; flex-wrap:wrap; }
  .controls .time{ font-variant-numeric:tabular-nums; font-size:20px; font-weight:600; }
  .controls .spacer{ flex:1; }
  h2{ font-family:Newsreader,Georgia,serif; font-weight:600; font-size:26px; margin:22px 0 6px; text-shadow:1px 1px 0 rgba(0,0,0,.1); }
  .hint{ color:var(--muted); font-size:18px; margin:0 0 8px; }

  /* ---- timeline ---- */
  .tlwrap{ background:var(--panel); border-radius:12px; padding:6px 0 6px; margin-top:6px; }
  .tl{ position:relative; overflow-x:auto; overflow-y:hidden; -webkit-overflow-scrolling:touch; }
  .tlin{ position:relative; height:470px; }
  .lane{ position:absolute; left:0; right:0; }
  .lane .lab{ position:sticky; left:0; display:inline-block; background:rgba(38,34,31,.8); color:#fff; font-size:15px; font-weight:700; padding:1px 8px; border-radius:0 6px 6px 0; z-index:2; pointer-events:none; }
  .ruler{ top:0; height:26px; background:var(--panel2); }
  .tick{ position:absolute; top:0; width:1px; height:10px; background:var(--muted); } .tick.s5{ height:26px; }
  .tick span{ position:absolute; left:4px; top:6px; font-size:13px; color:var(--muted); white-space:nowrap; }
  .l-v1{ top:28px; height:160px; background:rgba(167,95,60,.10); } .l-script{ top:190px; height:60px; } .l-a1{ top:254px; height:64px; } .l-a2{ top:322px; height:64px; } .l-v2{ top:390px; height:74px; }
  .sheet{ position:fixed; left:0; right:0; bottom:0; background:var(--panel); border-top:3px solid var(--accent); border-radius:16px 16px 0 0; padding:16px 18px 90px; box-shadow:0 -10px 30px rgba(0,0,0,.25); z-index:15; max-height:70vh; overflow:auto; } .sheet[hidden]{ display:none; } .sheet .id{ display:inline-block; background:var(--accent); color:var(--accent-ink); font-weight:700; padding:2px 10px; border-radius:6px; font-size:17px; } .sheet h3{ font-family:Newsreader,Georgia,serif; font-size:26px; margin:8px 0 4px; } .sheet .line{ font-size:22px; line-height:1.4; margin:6px 0 10px; } .sheet .st{ color:var(--muted); font-size:17px; }
  .lanebg{ position:absolute; inset:0; border-top:1px dashed var(--line); }
  .blk{ position:absolute; top:3px; bottom:3px; border-radius:8px; overflow:hidden; border:3px solid transparent; user-select:none; -webkit-user-select:none; touch-action:none; background:var(--v1); color:var(--text); }
  .blk.v2{ background:var(--v2); } .blk.a2{ background:var(--a2); } .blk.a1{ background:#b9a06f; } .blk.a1.free{ background:#a58a58; border-style:dashed; } .blk.script{ background:var(--script); touch-action:pan-x; }
  .blk.sel{ border-color:var(--sel); z-index:3; } .blk.drag{ opacity:.6; z-index:4; }
  .blk .th{ position:absolute; inset:0; background-size:cover; background-position:center; opacity:.55; pointer-events:none; }
  .blk.v1 .th{ opacity:1; } .blk.v1::after{ content:""; position:absolute; left:0; right:0; bottom:0; height:58%; background:linear-gradient(transparent, rgba(38,34,31,.85)); pointer-events:none; }
  .blk.v1 .t{ position:absolute; left:0; right:0; bottom:22px; padding:0 24px; font-size:19px; color:#fff; text-shadow:1px 1px 2px #000; z-index:1; }
  .blk.v1 .s{ position:absolute; left:0; right:0; bottom:4px; padding:0 24px; font-size:15px; color:#f3ece1; opacity:1; text-shadow:1px 1px 2px #000; z-index:1; }
  .blk.v1{ border-width:4px; }
  .blk .t{ position:relative; padding:4px 22px 0 22px; font-size:14px; font-weight:700; line-height:1.15; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; text-shadow:0 0 3px var(--bg); }
  .blk .s{ position:relative; padding:0 22px; font-size:12.5px; color:var(--text); opacity:.9; line-height:1.15; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .blk.script .s{ white-space:normal; display:-webkit-box; -webkit-line-clamp:3; -webkit-box-orient:vertical; font-size:12.5px; }
  .hl,.hr{ position:absolute; top:0; bottom:0; width:20px; cursor:ew-resize; touch-action:none; z-index:2; }
  .hl{ left:0; } .hr{ right:0; }
  .hl::after,.hr::after{ content:""; position:absolute; top:22%; bottom:22%; width:5px; border-radius:3px; background:rgba(38,34,31,.55); left:7px; }
  .blk.sel .hl::after,.blk.sel .hr::after{ background:var(--sel); }
  #ph{ position:absolute; top:0; bottom:0; width:2px; background:var(--ph); z-index:5; pointer-events:none; }
  #ph::before{ content:""; position:absolute; top:0; left:-7px; border:8px solid transparent; border-top:12px solid var(--ph); }
  .zoom{ display:flex; gap:6px; align-items:center; margin:6px 8px 0; flex-wrap:wrap; }
  .zoom .k{ display:inline-flex; align-items:center; gap:6px; font-size:15px; color:var(--muted); margin-left:8px; } .k i{ display:inline-block; width:14px; height:14px; border-radius:3px; }

  /* ---- bins ---- */
  .strip{ display:flex; gap:10px; overflow-x:auto; padding:8px 4px 12px; -webkit-overflow-scrolling:touch; min-height:120px; }
  .strip:empty::after{ content:"Nothing here."; color:var(--muted); padding:20px; }
  .card{ flex:0 0 140px; background:var(--panel); border:3px solid transparent; border-radius:12px; overflow:hidden; user-select:none; -webkit-user-select:none; position:relative; }
  .card.sel{ border-color:var(--sel); } .card.todo{ opacity:.85; border-style:dashed; border-color:var(--line); }
  .card img{ display:block; width:100%; aspect-ratio:16/9; object-fit:cover; background:#000; pointer-events:none; }
  .card.audio .wave{ height:44px; background:linear-gradient(90deg,var(--a2),var(--panel2)); display:flex; align-items:center; justify-content:center; font-size:28px; }
  .card .num{ position:absolute; top:6px; left:6px; background:rgba(38,34,31,.8); color:#fff; font-weight:700; font-size:15px; padding:1px 8px; border-radius:6px; }
  .card .tag{ position:absolute; top:6px; right:6px; background:var(--ok); color:#fff; font-weight:700; font-size:13px; padding:1px 8px; border-radius:6px; }
  .card .t{ padding:5px 7px 2px; font-weight:600; font-size:14px; line-height:1.2; min-height:40px; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; }
  .card .line{ padding:0 7px 3px; color:var(--muted); font-size:12.5px; line-height:1.25; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; }
  .card .d{ padding:0 7px 7px; color:var(--muted); font-size:13px; }
  .pv{ display:grid; grid-template-columns:minmax(200px,380px) 1fr; gap:12px; align-items:center; margin:4px 0 8px; } .pv video{ width:100%; aspect-ratio:16/9; background:#000; border-radius:8px; } .pvt{ font-size:18px; color:var(--muted); } .pa{ display:flex; gap:10px; align-items:center; flex-wrap:wrap; margin:4px 0 8px; } .pa audio{ flex:1; min-width:220px; height:44px; } @media (max-width:520px){ .pv{ grid-template-columns:1fr; } }
  .actions{ display:flex; gap:8px; flex-wrap:wrap; align-items:center; margin:2px 0 6px; }
  .actions .lab{ font-weight:600; margin-right:4px; }
  .panel{ background:var(--panel); border-radius:12px; padding:14px 16px; margin-top:8px; } .panel[hidden]{ display:none; }
  .toast{ position:fixed; left:50%; bottom:78px; transform:translateX(-50%); background:var(--text); color:var(--bg); padding:12px 20px; border-radius:10px; font-weight:600; font-size:19px; opacity:0; transition:opacity .2s; pointer-events:none; max-width:92vw; text-align:center; z-index:20; }
  .toast.on{ opacity:1; }
  .savebar{ position:fixed; left:0; right:0; bottom:0; background:var(--panel); border-top:1px solid var(--line); padding:10px 16px; display:flex; gap:10px; align-items:center; justify-content:space-between; z-index:10; }
  .savebar .stat{ color:var(--muted); font-size:16px; }
  textarea{ width:100%; min-height:180px; font:15px Consolas,monospace; background:var(--bg); color:var(--text); border:1px solid var(--line); border-radius:8px; padding:8px; }
  @media (prefers-reduced-motion: reduce){ .toast{ transition:none } }
</style>
<div class="wrap">
  <header><div><div class="brand">LYFE <span>STUDIO</span></div><h1>Garage Dream · Storyboard</h1><p class="sub">Every scene, every character, every set and object. Tap anything to read the full note.</p></div>
  <a href="https://claude.ai/artifact/6uQh9o2LcpjCorpXKfEi7e" style="font-weight:600;color:var(--accent);font-size:18px">Open the Cut Room →</a></header>
<div id="viewBoard">
    <p class="hint" id="boardSub">Every scene, every character, every set and object, from Codex's storyboard. Tap anything to read the full note.</p>
    <div class="tabs" style="margin-top:0"><button class="on" data-sec="scenes">Scenes</button><button data-sec="chars">Characters</button><button data-sec="objects">Sets &amp; objects</button></div>
    <div id="secScenes"><div class="grid" id="bScenes"></div></div>
    <div id="secChars" hidden></div>
    <div id="secObjects" hidden><div class="grid" id="bObjects"></div></div>
  </div>
</div>
<div class="sheet" id="sheet" hidden><span class="id" id="shId"></span><h3 id="shTitle"></h3><div class="line" id="shLine"></div><div class="st" id="shSt"></div><div class="actions" style="margin-top:12px"><button class="primary" id="shPlay">▶ Play this scene</button><button id="shClose">Close</button></div></div>
<script>
const FPS = 24; const $ = id => document.getElementById(id);
const fmt = f => { const s = f / FPS; return `${Math.floor(s/60)}:${String(Math.floor(s%60)).padStart(2,'0')}.${Math.floor((s%1)*10)}`; };
function stop(){}
// ---------- storyboard view
let BOARD = null;
document.querySelectorAll('#viewBoard .tabs button').forEach(b => b.onclick = () => { document.querySelectorAll('#viewBoard .tabs button').forEach(x => x.classList.toggle('on', x === b)); for (const s of ['Scenes','Chars','Objects']) $('sec' + s).hidden = ('sec' + s).toLowerCase() !== 'sec' + b.dataset.sec.toLowerCase(); });
const fD = d => d ? new Date(d + 'T12:00:00').toLocaleDateString('en-US', { month:'short', day:'numeric' }) : ''; const age = (d, base) => d && base && d < base ? ' · OLDER than the V74 cut' : '';
function sheetShow(id, ttl, body, st){ $('shId').textContent = id; $('shTitle').textContent = ttl; $('shLine').textContent = body; $('shSt').textContent = st || ''; $('shPlay').hidden = true; $('sheet').hidden = false; }
function bcard(img, id, idCls, ttl, txt, chip){ const el = document.createElement('div'); el.className = 'bcard'; el.innerHTML = `${img ? `<img src="${img}" alt="">` : '<div class="ph">no image yet</div>'}<div class="b">${id ? `<span class="id ${idCls||''}">${id}</span>` : ''}<h4>${ttl}</h4><p>${txt || ''}</p>${chip ? `<span class="chip${/OLDER/.test(chip) ? ' old' : ''}">${chip}</span>` : ''}</div>`; return el; }
async function loadBoard(){
  try { const r = await fetch('board.json', { cache:'no-store' }); BOARD = await r.json(); } catch(e) { $('boardSub').textContent = 'The storyboard data did not load.'; return; }
  $('boardSub').textContent = `${BOARD.scenes.length} scenes · ${BOARD.characters.length} characters · ${BOARD.objects.length} sets and objects · ${BOARD.currentCut || ''}. Tap anything to read the full note.`;
  $('bScenes').replaceChildren(...BOARD.scenes.map(s => { const chip = s.v74?.start != null ? `in V74 · ${fmt(Math.round(s.v74.start*24))}–${fmt(Math.round(s.v74.end*24))}` : (s.v74?.inCut === false ? 'left out of V74' : 'not built yet'); const el = bcard(s.still, s.id, s.v74?.start != null ? 'ok' : 'no', s.title, s.line, chip + (s.stillDate ? ' · still ' + fD(s.stillDate) + age(s.stillDate, BOARD.v74Date) : '')); el.onclick = () => sheetShow(s.id, s.title, s.line + (s.v74?.note ? '\n\n' + s.v74.note : ''), s.status); return el; }));
  $('secChars').replaceChildren(...BOARD.characters.map(c => { const d = document.createElement('div'); d.className = 'char'; const f = c.continuity || {}; const facts = Object.entries(f).filter(([k]) => !['source','bodyReference','bodyStatus','coverage'].includes(k)).slice(0, 8).map(([k, v]) => `<b>${k}:</b> ${v}`).join(' · ');
    d.innerHTML = `<h3>${c.name}</h3><p class="facts">${c.status ? '<b>Status:</b> ' + c.status + '<br>' : ''}${c.voice ? '<b>Voice:</b> ' + (c.voice.voiceName || 'not set') + ' · ' + (c.voice.model || '') + '<br>' : ''}${facts}</p><div class="grid"></div>`;
    const g = d.querySelector('.grid'); for (const r of c.refs) { const el = bcard(r.img, r.approved ? 'APPROVED' : (r.group || 'reference'), r.approved ? 'ok' : 'no', r.title, r.role, (r.date ? fD(r.date) + age(r.date, BOARD.v74Date) + (r.status ? ' · ' : '') : '') + (r.status || '')); el.onclick = () => sheetShow(c.name + ' · ' + r.id, r.title, [r.role, r.notes].filter(Boolean).join('\n\n'), (r.approved ? 'APPROVED · ' : '') + (r.status || '') + (r.group ? ' · ' + r.group : '')); g.appendChild(el); }
    return d; }));
  $('bObjects').replaceChildren(...BOARD.objects.map(o => { const el = bcard(o.img, o.approved ? 'APPROVED' : '', 'ok', o.title, o.role, (o.date ? fD(o.date) + age(o.date, BOARD.v74Date) + (o.status ? ' · ' : '') : '') + (o.status || '')); el.onclick = () => sheetShow(o.approved ? 'APPROVED' : 'reference', o.title, o.role, o.status); return el; }));
}
$('shClose').addEventListener('click', () => { $('shPlay').hidden = false; });
$('shClose').onclick = () => { $('sheet').hidden = true; };
loadBoard();
</script>
