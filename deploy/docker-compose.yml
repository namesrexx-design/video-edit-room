# LYFE Studio shared server (Hetzner). One machine, every agent works here.
#
#   studio  the worker: render-cut, build-board, build-inventory, blender -b …  (docker compose exec studio bash)
#   web     Caddy: HTTPS + password in front of the storyboard page, the Cut Room and the media
#
# Files on the server:
#   /srv/lyfe/repo      git clone of namesrexx-design/video-edit-room   (text: storyboard, cuts, tools)
#   /srv/lyfe/media     working media, pulled from Cloudflare R2        (video/audio, ~20 GB)
#   /srv/lyfe/editor    built page, sheets, proxies                     (made by build-board)
services:
  studio:
    build: .
    image: lyfe-studio:latest
    restart: unless-stopped
    env_file: .env
    environment:
      LYFE_SERVER: "1"
    command: ["bash", "-lc", "git config --global --add safe.directory /repo && git config --global user.name 'LYFE Studio server' && git config --global user.email noreply@biz-box.io && exec node /repo/deploy/studio-api.mjs"]
    expose:
      - "8787"
    volumes:
      - /root/.ssh:/root/.ssh:ro
      - /srv/lyfe/repo:/repo
      - /srv/lyfe/media:/data/media
      - /srv/lyfe/editor:/data/editor

  connector:
    image: lyfe-studio:latest
    restart: unless-stopped
    env_file: .env
    working_dir: /app
    command: ["bash", "-lc", "[ -d node_modules/@modelcontextprotocol ] || npm install --omit=dev --no-audit --no-fund; exec node server.mjs"]
    expose:
      - "8790"
    volumes:
      - ./connector:/app
      - /srv/lyfe/connector/signing.pem:/run/connector/signing.pem:ro
      - /srv/lyfe/tools-bg:/opt/tools-bg:ro

  # The posting queue (Rexx 2026-09-17: "we build our own schedule on our server").
  # Handoff by default: at the scheduled minute a post becomes "ready" and he posts it in one motion.
  # A platform only posts itself once its app review is approved and it is named in SCHEDULER_API_PLATFORMS.
  scheduler:
    image: lyfe-studio:latest
    restart: unless-stopped
    env_file: .env
    working_dir: /app
    command: ["bash", "-lc", "exec node /app/server.mjs"]
    environment:
      SCHEDULER_DB: /data/scheduler/posts.json
      SCHEDULER_MEDIA: /data/media
      SCHEDULER_REPO: /repo
    expose:
      - "8791"
    volumes:
      - ./scheduler:/app:ro
      - /srv/lyfe/repo:/repo:ro
      - /srv/lyfe/media:/data/media:ro
      - /srv/lyfe/scheduler:/data/scheduler

  web:
    image: caddy:2
    restart: unless-stopped
    env_file: .env
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - /srv/lyfe/repo:/srv/repo:ro
      - /srv/lyfe/editor:/srv/editor:ro
      - /srv/lyfe/media:/srv/media:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  caddy_data:
  caddy_config:
